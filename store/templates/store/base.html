{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>{% block title %}DBSEELY | Rewards{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #f36b21;
            --primary-dark: #dc5715;
            --primary-light: #fff1e8;
            --dark: #171717;
            --text: #444444;
            --muted: #858585;
            --border: #e9e9e9;
            --background: #f8f8f8;
            --white: #ffffff;
            --success: #168653;
            --radius: 16px;
            --shadow: 0 12px 35px rgba(0, 0, 0, 0.045);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        /* Navigation */

        .site-header {
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 10;
        }

        .nav {
            max-width: 1180px;
            margin: auto;
            padding: 20px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: var(--dark);
        }

        .logo span {
            color: var(--primary);
        }

        .badge {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-dark);
            background: var(--primary-light);
            border: 1px solid #ffdfcc;
            border-radius: 30px;
            padding: 7px 13px;
        }

        /* Main layout */

        .page-shell {
            width: 100%;
            max-width: 1180px;
            margin: auto;
            padding: 55px 28px 70px;
        }

        .hero {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            margin-bottom: 35px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            background: var(--primary-light);
            color: var(--primary-dark);
            border-radius: 30px;
            padding: 7px 13px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .hero h1 {
            font-size: clamp(32px, 5vw, 48px);
            line-height: 1.12;
            letter-spacing: -2px;
            font-weight: 800;
            max-width: 750px;
            margin-bottom: 14px;
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero p {
            max-width: 620px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.8;
        }

        /* Cards */

        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
        }

        .card h2 {
            font-size: 20px;
            letter-spacing: -0.5px;
            margin-bottom: 7px;
        }

        .card > p {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* Features */

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .feature {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 18px;
        }

        .feature h3 {
            font-size: 13px;
            margin-bottom: 5px;
        }

        .feature p {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }

        /* Forms */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
            min-width: 0;
        }

        .field label {
            font-size: 12px;
            font-weight: 700;
            color: #333333;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            min-height: 49px;
            padding: 13px 15px;
            border: 1px solid #dedede;
            border-radius: 9px;
            background: #ffffff;
            color: var(--dark);
            outline: none;
            font-size: 13px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .field textarea {
            min-height: 100px;
            resize: vertical;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(243, 107, 33, 0.10);
        }

        .field input::placeholder,
        .field textarea::placeholder {
            color: #aaaaaa;
        }

        .field-error,
        .errorlist {
            color: #d93636;
            font-size: 12px;
            list-style: none;
        }

        /* Checkbox */

        .checkbox {
            display: flex;
            align-items: flex-start;
            gap: 11px;
            margin: 12px 0 24px;
            color: var(--text);
            font-size: 12px;
            line-height: 1.7;
        }

        .checkbox input {
            width: 16px;
            height: 16px;
            margin-top: 3px;
            accent-color: var(--primary);
            flex-shrink: 0;
        }

        /* Buttons */

        .submit-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 52px;
            border: none;
            border-radius: 9px;
            background: var(--primary);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .submit-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 45px;
            padding: 0 20px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: white;
            color: var(--dark);
            font-size: 13px;
            font-weight: 600;
        }

        /* Status messages */

        .alert {
            padding: 14px 16px;
            border-radius: 9px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .alert-success {
            color: #126c43;
            background: #eaf8f0;
            border: 1px solid #c8ead7;
        }

        .alert-error {
            color: #a92828;
            background: #fff0f0;
            border: 1px solid #f2cccc;
        }

        /* Footer */

        .footer {
            border-top: 1px solid var(--border);
            background: white;
            padding: 25px 28px;
            text-align: center;
        }

        .footer p {
            color: var(--muted);
            font-size: 11px;
        }

        /* Responsive */

        @media (max-width: 700px) {
            .nav {
                padding: 17px 20px;
            }

            .page-shell {
                padding: 38px 18px 50px;
            }

            .hero h1 {
                font-size: 35px;
            }

            .card {
                padding: 22px 18px;
            }

            .features {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }

        @media (max-width: 380px) {
            .logo {
                font-size: 21px;
            }

            .badge {
                font-size: 10px;
                padding: 6px 9px;
            }

            .hero h1 {
                font-size: 30px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <header class="site-header">
        <div class="nav">
            <a href="/" class="logo">DB<span>SEELY</span></a>
            <div class="badge">Rewards Platform</div>
        </div>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© {% now "Y" %} DBSEELY. All rights reserved.</p>
    </footer>

    {% block extra_js %}{% endblock %}

</body>
</html>
